name: Build Ghostgram (Windows x64)

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - master
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'

jobs:
  build:
    name: Build Ghostgram Windows x64
    runs-on: windows-latest

    env:
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: "false"
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          git config --global user.email "ghostgram@example.com"
          git config --global user.name "Ghostgram"

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: NuGet sources
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache
        id: cache-third-party
        uses: actions/cache@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache
        id: cache-libs
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-v2-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-libs-v2-

      - name: Qt cache
        id: cache-qt
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-qt-

      - name: Prepare Libraries
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat skip-release silent

      - name: Setup Build Configuration & API Credentials
        shell: bash
        run: |
          echo "TDESKTOP_BUILD_ARCH=x64" >> $GITHUB_ENV
          echo "TDESKTOP_BUILD_GENERATOR=" >> $GITHUB_ENV
          echo "TDESKTOP_BUILD_DEFINE=" >> $GITHUB_ENV

          API="-D TDESKTOP_API_TEST=ON"
          if [ -n "${{ secrets.CUSTOM_API_ID }}" ]; then
            echo "Using custom API ID and Hash from Secrets."
            API="-D TDESKTOP_API_ID=${{ secrets.CUSTOM_API_ID }} -D TDESKTOP_API_HASH=${{ secrets.CUSTOM_API_HASH }}"
          elif [ $GITHUB_REF == 'refs/heads/nightly' ]; then
            API="-D TDESKTOP_API_ID=611335 -D TDESKTOP_API_HASH=d524b414d21f4d37f08684c1df41ac9c"
          fi
          echo "TDESKTOP_BUILD_API=$API" >> $GITHUB_ENV

      - name: Free up disk space
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete

      - name: Build Ghostgram
        if: env.ONLY_CACHE == 'false'
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          %TDESKTOP_BUILD_GENERATOR% ^
          %TDESKTOP_BUILD_ARCH% ^
          %TDESKTOP_BUILD_API% ^
          -D CMAKE_CONFIGURATION_TYPES=Debug ^
          -D CMAKE_COMPILE_WARNING_AS_ERROR=OFF ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF ^
          %TDESKTOP_BUILD_DEFINE%

          cmake --build ..\out --config Debug --parallel

      - name: Package Artifact
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\Debug
          mkdir artifact
          if exist %OUT%\Ghostgram.exe copy %OUT%\Ghostgram.exe artifact\Ghostgram.exe
          if exist %OUT%\Telegram.exe copy %OUT%\Telegram.exe artifact\Ghostgram.exe
          if exist %OUT%\Updater.exe copy %OUT%\Updater.exe artifact\
          mkdir artifact\portable\tdata
          copy artifact\Ghostgram.exe artifact\portable\
          if exist artifact\Updater.exe copy artifact\Updater.exe artifact\portable\
          powershell -Command "Compress-Archive -Path 'artifact\portable\*' -DestinationPath 'artifact\Ghostgram-Portable-x64.zip' -Force"

      - name: Upload Ghostgram Binary
        uses: actions/upload-artifact@v7
        with:
          name: Ghostgram-Windows-x64
          path: artifact\
          retention-days: 14

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: env.UPLOAD_ARTIFACT == 'true'
        with:
          files: |
            artifact/Ghostgram-Portable-x64.zip
            artifact/Ghostgram.exe
          tag_name: release-latest
          name: Ghostgram Latest Build 👻
          body: |
            ## 👻 Ghostgram — Готовая сборка

            ### 🔥 Активные функции:
            - **👻 Полный режим невидимки (Ghost Mode):** скрытие статуса набора текста/записи, невидимый просмотр историй (Stories), скрытное чтение личных сообщений.
            - **🗑️ Анти-удаление сообщений (Anti-Recall):** сохранение всех удаленных сообщений с пометкой `[удалено]`.
            - **🔓 Снятие ограничений каналов:** копирование текста и пересылка из защищенных чатов.
            - **👁️ Обход самоуничтожения медиа:** вечный просмотр и сохранение фото/видео/голосовых с таймером и на 1 просмотр.
            - **🚫 Полное отключение рекламы** в каналах и ботах.
            - **🏷️ Фирменный интерфейс:** логотип Ghostgram на верхней панели и отдельное меню настроек `Ghostgram Settings`.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
